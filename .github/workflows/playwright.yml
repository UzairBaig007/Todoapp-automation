name: Playwright E2E Tests

on:
  repository_dispatch:
    types: [run-tests]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App URL to test against'
        required: false
        default: ''

jobs:
  test:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ github.event.client_payload.app_url || secrets.BASE_URL }}

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Post results summary
        if: always()
        run: |
          echo "## 🎭 Playwright E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 App URL | ${{ github.event.client_payload.app_url || secrets.BASE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Triggered by | ${{ github.event.client_payload.triggered_by }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Commit | ${{ github.event.client_payload.commit }} |" >> $GITHUB_STEP_SUMMARY

      # ⭐ NEW — Reports E2E results back to dev repo PR
      - name: Report results back to dev repo PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEST_REPO_TOKEN }}
          script: |
            const owner = 'UzairBaig007';
            const repo = 'todoapplication';
            const sha = '${{ github.event.client_payload.commit }}';
            const success = '${{ job.status }}' === 'success';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state: success ? 'success' : 'failure',
              description: success ? 'All E2E tests passed!' : 'E2E tests failed!',
              context: 'Playwright E2E Tests'
            });
